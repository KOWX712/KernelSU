# DKMS configuration for the KernelSU out-of-tree kernel module.
# Module name/version must match the PKGBUILD ($pkgname-$pkgver).
PACKAGE_NAME="kernelsu"
PACKAGE_VERSION="1.0.0"

# ksud / Manager expect the module file to be named kernelsu.ko.
BUILT_MODULE_NAME[0]="kernelsu"

# kbuild emits kernelsu.ko in the module's kernel/ subdirectory (the kbuild
# M= dir), so the location is relative to the DKMS build dir.
BUILT_MODULE_LOCATION[0]="kernel"

# /extra is where Arch/dkms place out-of-tree modules
# (<kernelver>/updates/extras is a common alternative; /extra works on Arch).
DEST_MODULE_LOCATION[0]="/extra"

# Only build for kernels that actually provide buildable headers.
BUILD_EXCLUSIVE_KERNEL_MIN="6.6"

# The toolchain must match the target kernel: clang-built kernels (e.g. CachyOS)
# need LLVM=1, while gcc-built kernels (e.g. vanilla Arch linux) fail under clang
# with "unknown argument" errors for gcc-only flags. Probe the target kernel's
# .config at eval time: CONFIG_CC_IS_CLANG=y is written only by clang-built
# kernels; otherwise no LLVM= is passed and kbuild uses its default CC.
#
# The command is single-quoted so dkms's `eval` expands the paths, the toolchain
# probe and the $(cat ...) at eval-time, not when dkms.conf is sourced.
#
# M= must point at the BUILD dir, not the source dir: do_build copies
# source/ -> build/ BEFORE running make (cwd is build_dir while the command is
# eval'd) and then collects $build_dir/kernel/kernelsu.ko — building into
# source/ would make dkms ship a stale pre-make copy from the previous build.
# With M=build/kernel the output lands exactly where dkms collects it and the
# source tree stays pristine forever. The git repo and ksu_version are copied
# into build/ by the same cp, so version detection still works there; the
# KSU_VERSION fallback below reads the package-owned file in source/.
#
# No CLEAN= target: dkms 3.x never runs CLEAN (it only warns as deprecated) and
# removes its build dir itself; kbuild rebuilds objects when kernel or CC change.
MAKE[0]='make -C "${kernel_source_dir}" M="'${dkms_tree}'/'${module}'/'${module_version}'/build/kernel" $(grep -q "^CONFIG_CC_IS_CLANG=y" "${kernel_source_dir}/.config" 2>/dev/null && echo LLVM=1) KSU_VERSION="$(cat "'${dkms_tree}'/'${module}'/'${module_version}'/source/ksu_version" 2>/dev/null || echo 30001)" CONFIG_KSU=m CONFIG_KSU_NON_ANDROID=y CONFIG_KSU_SELINUX=n CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y modules'
