# DKMS configuration for the KernelSU out-of-tree kernel module.
# Module name/version must match the PKGBUILD ($pkgname-$pkgver).
PACKAGE_NAME="kernelsu"
PACKAGE_VERSION="1.0.0"

# ksud / Manager expect the module file to be named kernelsu.ko.
BUILT_MODULE_NAME[0]="kernelsu"

# kbuild emits kernelsu.ko in the module's kernel/ subdirectory (the kbuild
# M= dir), so the location is relative to the DKMS build dir.
BUILT_MODULE_LOCATION[0]="kernel"

# /extra is where Arch/dkms place out-of-tree modules
# (<kernelver>/updates/extras is a common alternative; /extra works on Arch).
DEST_MODULE_LOCATION[0]="/extra"

# Only build for kernels that actually provide buildable headers.
BUILD_EXCLUSIVE_KERNEL_MIN="6.6"

# The kernel is clang/LLVM-built, so the module must be too (LLVM=1). The DKMS
# source tree (a copy) contains kernel/{Kbuild,Makefile,...} plus ksu_version at
# its root; it lives at $dkms_tree/$module/$module_version/source (same base as
# the build dir, which dkms defaults to at /usr/bin/dkms:797). dkms does not
# expose a global for the module source dir, but $dkms_tree/$module/$module_version
# are global, so we compose the path ourselves.
#
# The command is single-quoted so dkms's `eval` expands the paths and the
# $(cat ...) at eval-time, not when dkms.conf is sourced. The kbuild M= dir is
# the module's kernel/ subdirectory; ksud/Manager expect kernelsu.ko.
MAKE[0]='make -C "${kernel_source_dir}" M="'${dkms_tree}'/'${module}'/'${module_version}'/source/kernel" LLVM=1 KSU_VERSION="$(cat "'${dkms_tree}'/'${module}'/'${module_version}'/source/ksu_version" 2>/dev/null || echo 30001)" CONFIG_KSU=m CONFIG_KSU_NON_ANDROID=y CONFIG_KSU_SELINUX=n CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y modules'
CLEAN='make -C "${kernel_source_dir}" M="'${dkms_tree}'/'${module}'/'${module_version}'/source/kernel" LLVM=1 CONFIG_KSU=m CONFIG_KSU_NON_ANDROID=y CONFIG_KSU_SELINUX=n CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y clean'
