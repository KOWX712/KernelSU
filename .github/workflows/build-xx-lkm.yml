name: Build XX-branch LKM for KernelSU
on:
  workflow_call:
    inputs:
      package_name:
        description: 'package name of manager'
        required: false
        default: ''
        type: string
      expected_size:
        description: 'expected signature size'
        required: false
        default: ''
        type: string
      expected_hash:
        description: 'expected signature hash'
        required: false
        default: ''
        type: string
  workflow_dispatch:
jobs:
  checkout-and-build:
    name: Build ${{ matrix.kmi }} from xx branch
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Get KowSU version
      id: version
      run: |
        git config --global --add safe.directory /__w/KernelSU/KernelSU
        cd kernel
        KSU_GIT_VERSION=$(git rev-list --count HEAD)
        KSU_VERSION=$(expr 30000 + $KSU_GIT_VERSION)
        echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_OUTPUT
        echo "Calculated KSU_VERSION: $KSU_VERSION"

    - name: Fetch and checkout xxKSU
      run: |
        git remote add xx https://github.com/backslashxx/KernelSU
        git fetch xx master
        git checkout xx/master

        curl -sSL https://raw.githubusercontent.com/KOWX712/files/main/KowSU/xxksu.patch | patch -p1

        sed -i "s/CFLAGS_ksu.o += -DKSU_VERSION=.*/CFLAGS_ksu.o += -DKSU_VERSION=${{ steps.version.outputs.KSU_VERSION }}/" kernel/Makefile

    - name: Build kernelsu.ko
      env:
        PACKAGE_NAME: ${{ inputs.package_name }}
        EXPECTED_SIZE: ${{ inputs.expected_size }}
        EXPECTED_HASH: ${{ inputs.expected_hash }}
      run: |
        git config --global --add safe.directory /__w/KernelSU/KernelSU

        cd kernel

        echo "=== Building kernelsu.ko for KMI: ${{ matrix.kmi }} from xx branch ==="

        # The xx branch Makefile carries upstream defaults; fall back to KowSU
        # values when the caller doesn't provide them (e.g. non-PR builds).
        PACKAGE_NAME="${PACKAGE_NAME:-com.kowx712.supermanager}"
        EXPECTED_SIZE="${EXPECTED_SIZE:-0x375}"
        EXPECTED_HASH="${EXPECTED_HASH:-484fcba6e6c43b1fb09700633bf2fb4758f13cb0b2f4457b80d075084b26c588}"

        EXTRA_ARGS="KSU_PACKAGE_NAME=$PACKAGE_NAME"
        EXTRA_ARGS="$EXTRA_ARGS KSU_EXPECTED_SIZE=$EXPECTED_SIZE"
        EXTRA_ARGS="$EXTRA_ARGS KSU_EXPECTED_HASH=$EXPECTED_HASH"
        CONFIG_KSU=m CC=clang make $EXTRA_ARGS

        echo "=== Build completed ==="

        # Create output directory in GitHub workspace
        mkdir -p /github/workspace/out

        # Copy with xx- prefix and KMI-specific naming
        OUTPUT_NAME="xx-${{ matrix.kmi }}_kernelsu.ko"
        cp kernelsu.ko "/github/workspace/out/$OUTPUT_NAME"

        echo "Copied to: /github/workspace/out/$OUTPUT_NAME"
        ls -la "/github/workspace/out/$OUTPUT_NAME"
        echo "Size: $(du -h "/github/workspace/out/$OUTPUT_NAME" | cut -f1)"
        llvm-strip -d "/github/workspace/out/$OUTPUT_NAME"
        echo "Size after stripping: $(du -h "/github/workspace/out/$OUTPUT_NAME" | cut -f1)"

    - name: Upload xx-kernelsu.ko artifact
      uses: actions/upload-artifact@v7
      with:
        name: xx-${{ matrix.kmi }}-lkm
        path: /github/workspace/out/xx-${{ matrix.kmi }}_kernelsu.ko
